<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><base href="{{base}}">
<link rel="stylesheet" href="templates/_comum.css">
<style>
html,body{width:1080px;height:1350px}
.bg{background-image:url("{{fundo}}")}
.pill{position:absolute;left:90px;top:482px}
h1{position:absolute;left:90px;top:{{titulo_top}}px;width:910px;margin:0;font-family:"Saira";font-weight:800;font-size:{{titulo_px}}px;line-height:1.02;letter-spacing:-.005em}
.traco{position:absolute;left:90px;top:985px;width:60px;height:4px;background:var(--cyan)}
.apoio{position:absolute;left:90px;top:1015px;width:900px;font-size:36px;line-height:1.4;font-weight:500;color:#DCE4EC}
.rodape{position:absolute;left:90px;right:90px;bottom:98px;display:flex;justify-content:space-between;align-items:baseline}
.marca-dagua{position:absolute;right:40px;bottom:-40px;font-family:"Saira";font-weight:800;font-size:420px;line-height:1;color:rgba(255,255,255,.05);letter-spacing:-.04em}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div><div class="filete"></div>
<div class="marca-dagua">EP</div>
<img class="logo" src="logo/logo-ep-branco.png" alt="">
<div class="squares"><i></i><i></i><i></i><i></i></div>
<div class="pill">{{tag}}</div>
<h1>{{titulo}}</h1>
<div class="traco"></div>
<div class="apoio">{{apoio}}</div>
<div class="rodape"><span class="handle">{{handle}}</span><span class="arraste">arraste &rarr;</span></div>
</body></html>
