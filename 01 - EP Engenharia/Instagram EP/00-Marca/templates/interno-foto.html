<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><base href="{{base}}">
<link rel="stylesheet" href="templates/_comum.css">
<style>
html,body{width:1080px;height:1350px}
.bg{background-image:url("{{fundo}}");filter:none;transform:none}
.veil{background:linear-gradient(180deg,rgba(11,31,51,.45) 0%,rgba(11,31,51,.72) 55%,rgba(11,31,51,.94) 100%)}
.badge{position:absolute;left:90px;top:92px;width:110px;height:110px;border-radius:22px;background:var(--cyan);display:flex;align-items:center;justify-content:center;font-family:"Saira";font-weight:800;font-size:60px;color:#fff}
.logo-s{position:absolute;right:90px;top:92px;width:130px}
.conteudo{position:absolute;left:90px;right:90px;bottom:200px}
.rotulo{font-weight:600;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:26px}
h2{margin:0;font-family:"Saira";font-weight:800;font-size:{{titulo_px}}px;line-height:1.06;color:#fff}
.corpo{margin:34px 0 0;font-size:38px;line-height:1.5;color:#DCE4EC}
.legenda{position:absolute;left:90px;bottom:98px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:28px;color:#fff}
.legenda::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--cyan)}
.rodape{position:absolute;right:90px;bottom:98px}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div><div class="filete"></div>
<div class="badge">{{n}}</div>
<img class="logo-s" src="logo/logo-ep-branco.png" alt="">
<div class="conteudo">
  <div class="rotulo">{{rotulo}} {{n}} de {{total}}</div>
  <h2>{{titulo}}</h2>
  <p class="corpo">{{corpo}}</p>
</div>
<div class="legenda">{{legenda_foto}}</div>
<div class="rodape"><span class="handle">{{handle}}</span></div>
</body></html>
