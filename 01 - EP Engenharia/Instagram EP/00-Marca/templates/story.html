<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><base href="{{base}}">
<link rel="stylesheet" href="templates/_comum.css">
<style>
html,body{width:1080px;height:1920px}
.bg{background-image:url("{{fundo}}")}
.logo{top:150px;left:100px}
.squares{top:160px;right:96px;width:72px;height:72px;gap:10px}
.deco{position:absolute;border:3px solid rgba(255,255,255,.22);border-radius:36px}
.deco.a{right:110px;top:280px;width:200px;height:200px}
.deco.b{right:-120px;top:280px;width:200px;height:200px}
.deco.c{right:110px;top:510px;width:200px;height:200px}
.deco.d{right:-120px;top:510px;width:200px;height:200px;background:rgba(0,163,224,.18);border-color:transparent}
.pill{position:absolute;left:96px;top:612px;font-size:30px;padding:20px 40px;border-color:rgba(0,163,224,.55);background:rgba(0,163,224,.16)}
h1{position:absolute;left:96px;top:{{titulo_top}}px;width:900px;margin:0;font-family:"Saira";font-weight:800;font-size:{{titulo_px}}px;line-height:1.08}
.apoio{position:absolute;left:96px;top:{{apoio_top}}px;width:880px;font-size:44px;line-height:1.35;color:#CFD9E3}
.linha{position:absolute;left:96px;right:96px;top:1455px;height:2px;background:rgba(255,255,255,.3)}
.ponte{position:absolute;left:96px;top:1520px;font-family:"Saira";font-weight:800;font-size:62px;line-height:1}
.circulo{position:absolute;right:150px;top:1485px;width:130px;height:130px;border-radius:50%;background:var(--cyan);display:flex;align-items:center;justify-content:center;font-size:66px}
.cima{position:absolute;right:60px;top:1630px;width:310px;text-align:center;font-weight:600;font-size:23px;letter-spacing:.14em;white-space:nowrap}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="deco a"></div><div class="deco b"></div><div class="deco c"></div><div class="deco d"></div>
<img class="logo" src="logo/logo-ep-branco.png" alt="">
<div class="squares"><i></i><i></i><i></i><i></i></div>
<div class="pill">{{tag}}</div>
<h1>{{titulo}}</h1>
<div class="apoio">{{apoio}}</div>
<div class="linha"></div>
<div class="ponte">{{ponte}}</div>
<div class="circulo">&#128070;</div>
<div class="cima">ARRASTE P/ CIMA</div>
</body></html>
