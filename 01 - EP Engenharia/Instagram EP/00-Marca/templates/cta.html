<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><base href="{{base}}">
<link rel="stylesheet" href="templates/_comum.css">
<style>
html,body{width:1080px;height:1350px}
.bg{background-image:url("{{fundo}}")}
.veil{background:linear-gradient(170deg,rgba(14,79,134,.86),rgba(27,111,168,.90))}
.deco{position:absolute;border:3px solid rgba(255,255,255,.22);border-radius:36px}
.deco.a{right:250px;top:-60px;width:300px;height:260px}
.deco.b{right:-90px;top:-60px;width:300px;height:260px}
.deco.c{right:250px;top:250px;width:300px;height:300px}
.deco.d{right:-90px;top:250px;width:300px;height:300px;background:rgba(0,163,224,.18);border-color:transparent}
.conteudo{position:absolute;left:86px;width:910px;top:{{titulo_top}}px}
h1{margin:0;font-family:"Saira";font-weight:800;font-size:{{titulo_px}}px;line-height:1.04}
.corpo{margin:40px 0 0;font-size:40px;line-height:1.5;color:#E3EAF1}
.contato{position:absolute;left:86px;bottom:236px;font-weight:500;font-size:32px;color:#DCE4EC;letter-spacing:.02em}
.btn{position:absolute;left:86px;bottom:98px;background:#fff;color:var(--navy);border-radius:70px;padding:34px 60px;font-weight:600;font-size:40px;line-height:1}
</style></head>
<body>
<div class="bg"></div><div class="veil"></div><div class="filete"></div>
<div class="deco a"></div><div class="deco b"></div><div class="deco c"></div><div class="deco d"></div>
<img class="logo" src="logo/logo-ep-branco.png" alt="">
<div class="conteudo">
  <h1>{{titulo}}</h1>
  <p class="corpo">{{corpo}}</p>
</div>
<div class="contato">{{contato}}</div>
<div class="btn">{{botao}}</div>
</body></html>
